name: Validate Node.js application

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/phishing-dashboard-analytics]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check browser JavaScript syntax
        run: node --check app.js
      - name: Check server JavaScript syntax
        run: node --check server.mjs
